{% extends 'base.html' %}
{% block title %}Password Reset Successful — Collabify{% endblock %}
{% block content %}
<div class="min-h-screen bg-gradient-to-br from-violet-50 via-purple-50 to-pink-50 flex items-center justify-center py-16 px-4">
  <div class="max-w-md w-full">

    <div class="bg-white rounded-3xl shadow-xl border border-gray-100 p-8 text-center">
      <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
        <span class="text-4xl">✅</span>
      </div>
      <h1 class="text-2xl font-bold text-gray-900 mb-3">Password Reset Successful!</h1>
      <p class="text-gray-600 leading-relaxed mb-8">
        Your password has been changed successfully. You can now log in with your new password.
      </p>
      <a href="/accounts/login/" class="btn-primary inline-block py-3 px-8 text-base">
        Login to Collabify
      </a>
    </div>

  </div>
</div>
{% endblock %}
