{% extends 'base.html' %}
{% block title %}Leave a Review — Collabify{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto px-4 py-10">
  <h1 class="text-3xl font-bold text-gray-900 mb-2">Leave a Review</h1>
  <p class="text-gray-600 mb-8">Share your experience with <span class="font-semibold text-violet-600">{{ target.user.get_full_name }}</span></p>
  <div class="bg-white rounded-3xl shadow-sm border border-gray-100 p-8">
    <form method="post">
      {% csrf_token %}
      <div class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Rating *</label>
          {{ form.rating }}
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Your Feedback *</label>
          {{ form.feedback }}
        </div>
        <button type="submit" class="btn-primary w-full py-3">Submit Review ⭐</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
