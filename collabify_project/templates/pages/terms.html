{% extends 'base.html' %}
{% block title %}Terms of Service — Collabify{% endblock %}
{% block content %}
<div class="max-w-3xl mx-auto px-4 py-16">
  <h1 class="text-4xl font-extrabold text-gray-900 mb-2">Terms of Service</h1>
  <p class="text-gray-500 mb-10">Last updated: January 1, 2024</p>

  <div class="space-y-6">
    {% for section in sections %}
    <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6">
      <h2 class="text-xl font-bold text-gray-900 mb-3">{{ section.title }}</h2>
      <p class="text-gray-600 leading-relaxed">{{ section.content }}</p>
    </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
